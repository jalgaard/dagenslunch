name: Uppdatera lunchmeny

on:
  schedule:
    # Flera försök på morgonen. Minuterna är medvetet inte :00 eftersom
    # GitHub Actions har högre belastning vid heltimme.
    - cron: '17 7 * * 1-5'
      timezone: 'Europe/Stockholm'
    - cron: '17 8 * * 1-5'
      timezone: 'Europe/Stockholm'
    - cron: '17 9 * * 1-5'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lunch-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Bygg dagens lunchsida
        env:
          TZ: Europe/Stockholm
        run: python build.py

      - name: Spara och publicera om något ändrats
        run: |
          if git diff --quiet -- index.html; then
            echo "Ingen ändring i index.html – inget att publicera."
            exit 0
          fi

          git config user.name "Lunch-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Uppdatera lunchmeny $(TZ=Europe/Stockholm date +%F)"
          git push
